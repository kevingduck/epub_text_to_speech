<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Audiobooks</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="view-library" class="view">
  <header>
    <h1>Audiobooks</h1>
    <button id="btn-upload" class="primary">+ Add book</button>
  </header>
  <form id="upload-form" hidden>
    <input type="file" id="file-input">
    <label>Voice
      <select id="upload-voice"></select>
    </label>
    <div class="row">
      <button type="submit" class="primary">Upload</button>
      <button type="button" id="btn-cancel-upload">Cancel</button>
    </div>
    <p id="upload-status" class="muted"></p>
  </form>
  <div id="book-list"></div>
</div>

<div id="view-player" class="view" hidden>
  <header>
    <button id="btn-back">‹ Library</button>
  </header>
  <div class="player-head">
    <img id="p-cover" alt="" hidden>
    <div>
      <h2 id="p-title"></h2>
      <p id="p-author" class="muted"></p>
    </div>
  </div>

  <audio id="player" preload="metadata" playsinline controls></audio>

  <div class="transport">
    <button id="btn-back15">↺ 15</button>
    <button id="btn-playpause" class="primary big">▶</button>
    <button id="btn-fwd30">30 ↻</button>
    <select id="speed">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2×</option>
      <option value="2.5">2.5×</option>
    </select>
  </div>

  <h3>Chapters</h3>
  <div id="chapter-list"></div>

  <details id="rerender-box">
    <summary>Chapter selection &amp; re-render</summary>
    <p class="muted">Untick front matter or change the voice, then re-render.
    The current audio keeps playing until the new version is ready.</p>
    <div id="chapter-toggles"></div>
    <label>Voice <select id="rerender-voice"></select></label>
    <div class="row">
      <button id="btn-rerender" class="primary">Re-render</button>
      <button id="btn-delete" class="danger">Delete book</button>
    </div>
  </details>
</div>

<script src="/static/app.js"></script>
</body>
</html>
